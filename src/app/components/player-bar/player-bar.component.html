<div class="player-bar">
    <div class="duration">
        <span>{{ fmt(player.currentTime()) }}</span>
        <input type="range" class="progresso" min="0" step="1" [max]="player.duration() || 0" [value]="player.currentTime()"
            (input)="player.seek(+$any($event.target).value)" />
        <span>{{ fmt(player.duration()) }}</span>
    </div>

    <div class="control-section">
        <button (click)="player.prev()">⏮</button>
        <button (click)="player.toggle()">{{ player.playing() ? '⏸' : '▶' }}</button>
        <button (click)="player.next()">⏭</button>
        <button type="button" class="video-toggle" (click)="abrirVideo()" [disabled]="!player.current()"
            aria-label="Abrir vídeo da música atual" title="Abrir vídeo">▣</button>

        <button type="button" class="volume-toggle" (click)="volumeAberto = !volumeAberto"
            [attr.aria-expanded]="volumeAberto">🔊</button>
        @if (volumeAberto) {
            <input type="range" min="0" max="100" [value]="player.volume()"
                (input)="player.setVolume(+$any($event.target).value)" />
        }
    </div>

    <div class="info">
        <strong class="titulo">{{ player.current()?.titulo ?? 'Nenhuma música' }}</strong>
        @if (player.current()?.artista) {
            <span class="artista">{{ player.current()?.artista }}</span>
        }
    </div>

    <div #videoModal class="video-modal" [class.aberto]="videoAberto"
        [style.left.px]="modalLeft" [style.top.px]="modalTop"
        [style.right]="modalLeft === null ? '1rem' : 'auto'"
        role="dialog" aria-label="Vídeo da música atual" [attr.aria-hidden]="!videoAberto">
        @if (videoAberto) {
            <div class="video-modal-header" (pointerdown)="iniciarArraste($event)">
                <span>{{ tituloVideo }}</span>
                <button type="button" class="video-close" (click)="fecharVideo()" aria-label="Fechar vídeo">×</button>
            </div>
        }
        <div class="yt-box">
            <div id="yt-player"></div>
        </div>
    </div>
</div>
